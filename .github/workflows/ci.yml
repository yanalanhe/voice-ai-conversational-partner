name: CI

# Runs on every push/PR with zero credentials and zero API spend (ADR-003):
# every provider in server/tests and eval/ is a mock, so lint, type-check, and
# the full test suite -- including whatever eval quality gates land in
# eval/ -- gate merges without anyone provisioning a secret.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,zh]"

      - name: Lint (ruff)
        run: ruff check server/ eval/

      - name: Type check (mypy)
        run: mypy server/app server/tests eval

      - name: Test
        run: pytest server/ eval/ -v --cov=app --cov-report=term-missing

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npx vite build
